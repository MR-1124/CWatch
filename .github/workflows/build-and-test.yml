name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore CWatch.sln

    - name: Build Solution
      run: dotnet build CWatch.sln -c Release --no-restore

    - name: Run Test Suite
      run: dotnet test tests/CWatch.Tests/CWatch.Tests.csproj -c Release --no-build --verbosity normal
